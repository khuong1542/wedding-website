name: wedding

services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    volumes:
      - ./apps:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-wedding}
      DB_USERNAME: ${DB_USERNAME:-wedding}
      DB_PASSWORD: ${DB_PASSWORD:-wedding_local}
    depends_on:
      db:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    volumes:
      - ./apps:/var/www/html
      - frontend_node_modules:/var/www/html/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
    command:
      - sh
      - -ec
      - |
        rm -f /tmp/frontend-ready
        npm ci --include=dev --ignore-scripts
        npm run build
        touch /tmp/frontend-ready
        exec npm run build -- --watch
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -f /tmp/frontend-ready && test -f public/build/manifest.json',
        ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wedding}
      MYSQL_USER: ${DB_USERNAME:-wedding}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wedding_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - '127.0.0.1:${PHPMYADMIN_PORT:-8081}:80'
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_node_modules:
